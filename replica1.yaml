apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx-demo-rc1
  labels:
    app: nginx
    type: rc-prod
spec:
  replicas: 2
  selector:
    app: nginx-prod
  template:
    metadata:
      name: nginx-demo
      labels:
        app: nginx-prod1
    spec:
      containers:
      - name: nginx-cont1
        image: alpine
        command: ["/bin/sh"]
        args: ["-c", "while true; do date >> /var/log/index.html; sleep 10; done"]
        volumeMounts:
          - name: shared-data
            mountPath: /var/log
      - name: nginx-cont2
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:
          - name: shared-data
            mountPath: /usr/share/nginx/html
      volumes:
        - name: shared-data
          emptyDir: {}