apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo1
spec:
  containers:
    - name: nginx-cont1
      image: nginx:latest
      ports:
        - containerPort: 80

    - name: nginx-cont2
      image: nginx:latest
      command: ["/bin/sh","-c"]
      args:
        - sed -i 's/listen       80;/listen 8080;/' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
      ports:
        - containerPort: 8080