apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo3
spec:
  containers:
    - name: nginx-cont1
      image: nginx:latest
      resources:
        limits:
          cpu: "500m"
          memory: "500Mi"
        requests:
          cpu: "200m"
          memory: "200Mi"
      volumeMounts: 
        - name: shared-volume
          mountPath: /var/tmp
      ports:
        - containerPort: 80

    - name: nginx-cont2
      image: nginx:latest
      resources:
        limits:
          cpu: "500m"
          memory: "500Mi"
        requests:
          cpu: "200m"
          memory: "200Mi"
      command: ["/bin/sh","-c"]
      args:
        - sed -i 's/listen       80;/listen 8080;/' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
      ports:
        - containerPort: 8080
      volumeMounts: 
        - name: shared-volume
          mountPath: /usr/share/nginx/html

  volumes:
    - name: shared-volume
      emptyDir: {}
