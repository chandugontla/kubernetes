apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-demo-rs1
  labels:
    app: nginx-demo1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
    matchExpressions: 
      - {key: app, operator: Exists}
      - {key: type, operator: DoesNotExist}
  template:
    metadata:
      labels:
        app: nginx
        release: v1.2
    spec:
      containers:
      - name: nginx-cont1
        image: alpine
        command: ["/bin/sh"]
        args: ["-c", "while true; do date >> /var/log/index.html; sleep 10; done"]
        volumeMounts:
        - name: shared-data
          mountPath: /var/log
      - name: nginx-cont2
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
      volumes:
      - name: shared-data
        emptyDir: {}
