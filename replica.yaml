apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx-demo-rc
  labels:
    app: nginx
    type: rc-prod
spec:
  replicas: 2
  selector:
    app: nginx-prod
  template:
    metadata:
      name: nginx-demo
      labels:
        app: nginx-prod
    spec:
      containers:
      - name: nginx-cont
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "0.3"
